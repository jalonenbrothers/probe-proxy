[project]
name = "probe-proxy"
version = "0.3.0"
description = "Empirical reverse-proxy config synthesis with a verify-by-replay loop: catches the configs that silently break your app."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "docker>=7.0",
]

[project.scripts]
probe-proxy = "probe_proxy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# only ship the package; repo scripts/tests/data stay in the checkout
packages = ["probe_proxy"]